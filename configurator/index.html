<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChiLab Partition System Configurator</title>
<style>
  :root {
    --bg: #101114; --panel: #17181c; --panel2: #1d1f24; --line: #2a2d34;
    --text: #e8e6e1; --dim: #9a978f; --accent: #c9a36a; --accent2: #8c7440;
    --err: #e05555; --warn: #d9a03f; --ok: #6fbf73;
    font-size: 15px;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Helvetica Neue', -apple-system, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; align-items: center; gap: 14px; padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 15px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
  header h1 span { color: var(--accent); }
  header .sub { color: var(--dim); font-size: 12px; }
  #main { flex: 1; display: flex; min-height: 0; }
  #viewerWrap { flex: 1; position: relative; min-width: 0; }
  #viewer { position: absolute; inset: 0; }
  #viewerHud { position: absolute; top: 10px; left: 12px; display: flex; gap: 8px; z-index: 5; flex-wrap: wrap; }
  .hudBtn { background: rgba(23,24,28,.88); border: 1px solid var(--line); color: var(--text); padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }
  .hudBtn.active, .hudBtn:hover { border-color: var(--accent); color: var(--accent); }
  #lightWrap { position: absolute; bottom: 14px; left: 12px; display: flex; align-items: center; gap: 8px; background: rgba(23,24,28,.88); border: 1px solid var(--line); padding: 8px 12px; border-radius: 8px; z-index: 5; }
  #lightWrap label { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
  #lightWrap input[type=range] { accent-color: var(--accent); }
  #explodeWrap { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; background: rgba(23,24,28,.88); border: 1px solid var(--line); padding: 8px 16px; border-radius: 8px; z-index: 5; }
  #explodeWrap label { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
  #partCard { position: absolute; right: 12px; top: 12px; width: 300px; background: rgba(23,24,28,.94); border: 1px solid var(--line); border-radius: 8px; padding: 14px; font-size: 12.5px; display: none; z-index: 6; max-height: 70%; overflow: auto; }
  #partsList { position: absolute; left: 12px; top: 56px; bottom: 14px; width: 214px; background: rgba(23,24,28,.95); border: 1px solid var(--line); border-radius: 8px; z-index: 9; display: none; overflow-y: auto; padding: 6px; }
  #partsList h4 { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); padding: 8px 8px 6px; position: sticky; top: 0; background: rgba(23,24,28,.98); }
  #partsList .pl-item { padding: 6px 8px; border-radius: 5px; font-size: 11.5px; color: var(--dim); cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
  #partsList .pl-item:hover { background: var(--panel2); color: var(--text); }
  #partsList .pl-item.active { background: rgba(201,163,106,.16); color: var(--accent); }
  #partsList .pl-item .q { color: var(--dim); font-variant-numeric: tabular-nums; flex: 0 0 auto; }
  #drawingOverlay { position: absolute; inset: 0 0 0 236px; background: #fbfaf7; z-index: 7; display: none; flex-direction: column; }
  #drawingBar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid #ddd8cd; background: #f2efe8; }
  #drawingBar .hudBtn { background: #fff; color: #3a3128; border-color: #d5cfc2; }
  #drawingBar .hudBtn:hover, #drawingBar .hudBtn.active { border-color: var(--accent); color: var(--accent2); }
  #dwTitle { font-size: 12px; color: #6b6357; margin-left: 6px; }
  #drawingScroll { flex: 1; overflow: auto; padding: 10px; }
  #drawingScroll svg { width: 100%; height: auto; display: block; }
  #partCard h3 { font-size: 13px; color: var(--accent); margin-bottom: 6px; }
  #partCard table { width: 100%; border-collapse: collapse; margin-top: 6px; }
  #partCard td, #partCard th { border-top: 1px solid var(--line); padding: 3px 4px; text-align: left; font-size: 11.5px; color: var(--dim); }
  #partCard th { color: var(--text); }
  #sidebar { width: 400px; border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  #tabs { display: flex; border-bottom: 1px solid var(--line); }
  #tabs button { flex: 1; background: none; border: none; border-bottom: 2px solid transparent; color: var(--dim); padding: 11px 4px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
  #tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
  #panel { flex: 1; overflow-y: auto; padding: 16px; }
  .sec { margin-bottom: 20px; }
  .sec > h2 { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); margin-bottom: 9px; }
  .row { display: flex; gap: 10px; align-items: center; margin-bottom: 9px; }
  .row label { flex: 0 0 118px; font-size: 12.5px; color: var(--text); }
  .row input[type=range] { flex: 1; accent-color: var(--accent); }
  .row input[type=text], .row input[type=number], .row select {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; font-size: 12.5px; width: 92px;
  }
  .row select { width: auto; flex: 1; }
  .row input:focus, .row select:focus { outline: none; border-color: var(--accent); }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { background: var(--panel2); border: 1px solid var(--line); color: var(--dim); border-radius: 20px; padding: 6px 13px; font-size: 12px; cursor: pointer; }
  .pill.active { border-color: var(--accent); color: var(--accent); background: rgba(201,163,106,.08); }
  .swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .swatch { border: 2px solid var(--line); border-radius: 7px; height: 52px; cursor: pointer; position: relative; overflow: hidden; }
  .swatch.active { border-color: var(--accent); }
  .swatch span { position: absolute; left: 0; right: 0; bottom: 0; font-size: 9.5px; padding: 2px 4px; background: rgba(0,0,0,.55); color: #ddd; text-align: center; }
  .chip { border-radius: 6px; padding: 7px 10px; font-size: 12px; margin-bottom: 6px; }
  .chip.error { background: rgba(224,85,85,.12); border: 1px solid rgba(224,85,85,.5); color: #f0a0a0; }
  .chip.warn { background: rgba(217,160,63,.1); border: 1px solid rgba(217,160,63,.45); color: #e5c68a; }
  .chip.ok { background: rgba(111,191,115,.1); border: 1px solid rgba(111,191,115,.4); color: #a8d9ab; }
  .btn { background: var(--accent); color: #17130c; font-weight: 600; border: none; border-radius: 7px; padding: 10px 16px; font-size: 13px; cursor: pointer; width: 100%; margin-bottom: 8px; }
  .btn.secondary { background: var(--panel2); color: var(--text); border: 1px solid var(--line); }
  .btn.secondary:hover { border-color: var(--accent); }
  .btn:hover { filter: brightness(1.1); }
  #footer { border-top: 1px solid var(--line); padding: 12px 16px; background: var(--panel2); }
  #footer .total { display: flex; justify-content: space-between; align-items: baseline; }
  #footer .total b { font-size: 21px; color: var(--accent); }
  #footer .total .lbl { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .1em; }
  #footer .meta { color: var(--dim); font-size: 11px; margin-top: 3px; }
  table.bom { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 12px; }
  table.bom th { text-align: left; color: var(--dim); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; padding: 5px 6px; border-bottom: 1px solid var(--line); }
  table.bom td { padding: 5px 6px; border-bottom: 1px solid rgba(42,45,52,.6); }
  table.bom td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .partRow { cursor: pointer; }
  .partRow:hover td { color: var(--accent); }
  .dl { color: var(--accent); cursor: pointer; text-decoration: underline; font-size: 11px; white-space: nowrap; }
  .note { font-size: 11.5px; color: var(--dim); line-height: 1.45; margin-bottom: 8px; }
  input.ftIn { width: 108px !important; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
</style>
</head>
<body>
<header>
  <h1>CHILAB <span>PARTITION SYSTEM</span></h1>
  <div class="sub">steel + glass configurator · derived from shop set 102219.004</div>
</header>
<div id="main">
  <div id="viewerWrap">
    <div id="viewer"></div>
    <div id="viewerHud">
      <button class="hudBtn active" id="btnAssembled">Assembled</button>
      <button class="hudBtn" id="btnExploded">Exploded parts</button>
      <button class="hudBtn" id="btnGlassToggle">Hide glass</button>
      <button class="hudBtn" id="btnSwing">Swing doors</button>
      <button class="hudBtn" id="btnFront">Front</button>
      <button class="hudBtn" id="btnIso">Iso</button>
      <button class="hudBtn" id="btnTheme">Dark mode</button>
    </div>
    <div id="lightWrap">
      <label>Light</label>
      <input type="range" id="lightAz" min="0" max="360" value="140" title="direction" style="width:110px">
      <input type="range" id="lightEl" min="5" max="85" value="28" title="height" style="width:90px">
    </div>
    <div id="explodeWrap" style="display:none">
      <label>Explode</label>
      <input type="range" id="explodeAmt" min="0" max="100" value="40" style="width:220px">
    </div>
    <div id="partCard"></div>
    <div id="partsList"></div>
    <div id="drawingOverlay">
      <div id="drawingBar">
        <button class="hudBtn" id="dwPrev">◀</button>
        <button class="hudBtn" id="dwNext">▶</button>
        <button class="hudBtn" id="dw3D">3D view</button>
        <button class="hudBtn" id="dwSvg">Download SVG</button>
        <span id="dwTitle"></span>
      </div>
      <div id="drawingScroll"></div>
    </div>
  </div>
  <div id="sidebar">
    <div id="tabs">
      <button data-tab="layout" class="active">Layout</button>
      <button data-tab="doors">Doors</button>
      <button data-tab="finishes">Finishes</button>
      <button data-tab="quote">Quote + Files</button>
    </div>
    <div id="panel"></div>
    <div id="footer">
      <div class="total"><span class="lbl">Budget estimate</span><b id="totalPrice">$—</b></div>
      <div class="meta" id="totalMeta"></div>
    </div>
  </div>
</div>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
<script type="module" src="./app.js"></script>
</body>
</html>
